<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="./favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(90, 158, 214, 0.28), transparent 34%),
        linear-gradient(160deg, #102844 0%, #1a4574 58%, #16385f 100%);
    }

    .boot {
      width: 220px;
      text-align: center;
      color: #fff;
    }

    .boot-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .boot-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      animation: boot-spin 0.8s linear infinite;
    }

    .boot-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.18em;
    }

    .boot-bar {
      height: 3px;
      margin: 18px auto 0;
      width: 120px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.16);
    }

    .boot-bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: #fff;
      animation: boot-slide 1.1s ease-in-out infinite;
    }

    .boot-text {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.72);
    }

    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes boot-slide {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(320%);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="loader-wrapper">
    <div class="boot">
      <div class="boot-mark" aria-hidden="true">
        <div class="boot-ring"></div>
      </div>
      <div class="boot-title">ERP 工作台</div>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <div class="boot-text">正在加载</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
